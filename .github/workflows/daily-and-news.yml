name: FPL Dnevni Izvještaj i Vijesti

on:
  schedule:
    # 1) Pun dnevni izvještaj - jednom dnevno u 08:00 UTC.
    - cron: "0 8 * * *"
    # 2) Provjera novih videa/članaka - SVAKIH 45 MIN (skraćeno s 3h).
    #    Razlog: članci objavljeni tik prije utakmice (npr. "team news")
    #    mogu postati zastarjeli ako se ne provjere dovoljno brzo - kraći
    #    razmak smanjuje šansu da vijest stigne nakon što je utakmica
    #    već završila. Šalje poruku SAMO ako ima nešto stvarno novo.
    - cron: "*/45 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full (pun izvještaj) ili news (provjera vijesti)"
        required: false
        default: "full"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instaliraj ovisnosti
        run: pip install -r requirements.txt

      - name: Odredi mod
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          INPUT_MODE="${{ github.event.inputs.mode }}"
          if [ -n "$INPUT_MODE" ]; then
            echo "MODE=$INPUT_MODE" >> "$GITHUB_ENV"
          elif [ "$SCHEDULE" == "0 8 * * *" ]; then
            echo "MODE=full" >> "$GITHUB_ENV"
          else
            echo "MODE=news" >> "$GITHUB_ENV"
          fi

      - name: Pokreni pun izvještaj
        if: env.MODE == 'full'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
        run: python daily_report.py

      - name: Provjeri nove vijesti
        if: env.MODE == 'news'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
          RSS_LOOKBACK_HOURS: "2"
        run: python news_check.py

      - name: Spremi stanje (state.json)
        run: |
          git config user.name "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Ažuriraj stanje bota [skip ci]"
          git push

      - name: Javi na Telegram ako je nešto puklo
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="⚠️ FPL Bot: workflow 'FPL Dnevni Izvještaj i Vijesti' je pukao. Provjeri Actions log na GitHubu."
