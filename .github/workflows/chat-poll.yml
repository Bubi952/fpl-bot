name: FPL Podsjetnik za Rok

on:
  schedule:
    # Svakih 15 min - provjerava je li blizu gameweek rok (šalje samo
    # jednom po roku, ~3h prije). Chat pitanja se sad rješavaju odvojeno,
    # trenutno, preko Cloudflare webhooka (vidi chat-webhook.yml).
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instaliraj ovisnosti
        run: pip install -r requirements.txt

      - name: Provjeri je li blizu gameweek rok
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
        run: python deadline_reminder.py

            - name: Spremi stanje (state.json)
        run: |
          git config user.name "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "Nema promjena za spremiti."
          else
            git commit -m "Ažuriraj stanje [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push nije uspio, pokušavam ponovno ($i/5)..."
              sleep $((RANDOM % 5 + 2))
            done
          fi

      - name: Javi na Telegram ako je nešto puklo
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="⚠️ FPL Bot: workflow 'FPL Podsjetnik za Rok' je pukao. Provjeri Actions log na GitHubu."
