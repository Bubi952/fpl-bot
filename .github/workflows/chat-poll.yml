name: FPL Chat Bot (uzivo)

on:
  schedule:
    # Svaka 5 minute - provjerava ima li novih pitanja na Telegramu.
    # NAPOMENA: uz ovako čest raspored, repozitorij MORA biti Public da bi
    # GitHub Actions ostao potpuno besplatan (privatni repo ima limit od
    # 2000 min/mjesec, a ovo samo trosi oko 8600 min/mjesec).
    # Vidi README.md za detalje.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Odgovori na nova pitanja
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
        run: python chat_bot.py

      - name: Spremi stanje (state.json)
        run: |
          git config user.name "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Ažuriraj stanje chata [skip ci]"
          git push
