name: FPL Chat Bot (Webhook)

on:
  repository_dispatch:
    # Cloudflare Worker šalje ovaj event čim Telegram webhook primi novu
    # poruku - pokreće se gotovo trenutno (par sekundi), ne čeka raspored.
    types: [telegram_message]
  workflow_dispatch:
    inputs:
      text:
        description: "Testna poruka (ostavi prazno ako testiraš sliku)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instaliraj ovisnosti
        run: pip install -r requirements.txt

      - name: Odgovori na poruku
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
          MSG_CHAT_ID: ${{ github.event.client_payload.chat_id || secrets.TELEGRAM_CHAT_ID }}
          MSG_TEXT: ${{ github.event.client_payload.text || github.event.inputs.text }}
          MSG_PHOTO_FILE_ID: ${{ github.event.client_payload.photo_file_id }}
          MSG_CAPTION: ${{ github.event.client_payload.caption }}
        run: python chat_bot.py

            - name: Spremi stanje (state.json)
        run: |
          git config user.name "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "Nema promjena za spremiti."
          else
            git commit -m "Ažuriraj stanje [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push nije uspio, pokušavam ponovno ($i/5)..."
              sleep $((RANDOM % 5 + 2))
            done
          fi

      - name: Javi na Telegram ako je nešto puklo
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="⚠️ FPL Bot: workflow 'FPL Chat Bot (Webhook)' je pukao. Provjeri Actions log na GitHubu."
